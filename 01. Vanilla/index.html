<!DOCTYPE html>
<html lang="pt-BR">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Sudoku</title>

    <link rel="stylesheet" href="styles.css">
</head>

<body>

    <div class="game">

        <header>

            <h1>🪻 Sudoku</h1>

            <div class="top-info">

                <div class="info">
                    <span>⏱</span>
                    <span id="timer">00:00</span>
                </div>

                <div class="info">
                    ❤️
                    <span id="errors">0/3</span>
                </div>

            </div>

        </header>

        <div id="numbers"></div>

        <div id="board"></div>

        <div class="buttons">

            <button id="newGame">
                Novo jogo
            </button>

            <button id="hint">
                💡 Dica
            </button>

            <button id="check">
                Verificar
            </button>

        </div>

        <div id="message"></div>

    </div>

<script src="script.js"></script>

</body>

</html>
